<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects — Universo Laia</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="header">
  <div class="container brandbar">
    <div class="navrow">
      <div class="brand">Gabriela Barbosa</div>
      <nav class="menu">
        <a id="nav-home" href="index.html">Home</a>
        <a id="nav-about" href="about.html">About</a>
        <a id="nav-projects" href="projects.html">Projects</a>
        <a id="nav-contact" href="contact.html">Contact</a>
      </nav>
      <div class="lang">
        <button data-lang="pt">PT</button>
        <button data-lang="es">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <h2>Projects</h2>
      <div class="grid">
        <div class="col-6"><div id="proj-col-1"></div></div>
        <div class="col-6"><div id="proj-col-2"></div></div>
        <div class="col-12 small">Edit the links in <code>assets/data/projects.json</code>.</div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container small">© 2025 Gabriela Barbosa — LAIA</div>
</footer>
<script src="assets/js/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  const res = await fetch('assets/data/projects.json'); const projs = await res.json();
  const left = document.getElementById('proj-col-1'); const right = document.getElementById('proj-col-2');
  const half = Math.ceil(projs.length/2);
  const make = (p)=>`<div class="project"><div class="pill">${p.name}</div>
    <h3><a href="${p.url||'#'}" target="_blank" rel="noopener">${p.name}</a></h3>
    <p>${p.desc||''}</p><a class="button" id="open-label" href="${p.url||'#'}" target="_blank" rel="noopener">Open project</a></div>`;
  left.innerHTML = projs.slice(0,half).map(make).join('');
  right.innerHTML = projs.slice(half).map(make).join('');
});
</script>
</body></html>
